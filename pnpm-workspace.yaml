packages:
  - "packages/*"

# Turbopack resolves these optional imports in the Base/Coinbase wallet SDK.
packageExtensions:
  "@coinbase/cdp-sdk@1.58.0":
    dependencies:
      "@x402/core": "^2.25.0"
      "@x402/evm": "^2.25.0"
      "@x402/svm": "^2.25.0"

allowBuilds:
  bufferutil: false
  keccak: false
  utf-8-validate: false
  esbuild: false
  sharp: false
  unrs-resolver: false
